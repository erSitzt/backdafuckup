# Development database for backdafuckup. Not for production use.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: backdafuckup
      POSTGRES_USER: backdafuckup
      POSTGRES_PASSWORD: backdafuckup-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bdfu-pgdata:/var/lib/postgresql/data
volumes:
  bdfu-pgdata:
# Fixed subnet: Docker's automatic pool hands out 172.16-31.x, which collides
# with a corporate LAN in that range (Grafana ingress, rke2 nodes) and makes those
# hosts unreachable from every container while this network exists.
networks:
  default:
    ipam:
      config:
        - subnet: 11.101.0.0/24

name: ci

on:
  push:
  pull_request:

jobs:
  build-and-unit-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build backdafuckup.slnx -c Release
      - run: dotnet test --solution backdafuckup.slnx -c Release --no-build --filter-not-trait "Category=Integration" --filter-not-trait "Category=Lab"

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build backdafuckup.slnx -c Release
      - run: dotnet test --solution backdafuckup.slnx -c Release --no-build --filter-trait "Category=Integration"
